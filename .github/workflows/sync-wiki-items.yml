name: Sync Minecraft Wiki items

on:
  schedule:
    - cron: "15 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "catalog/variants.json"
      - ".github/workflows/sync-wiki-items.yml"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: sync-wiki-items
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm run sync
        run: npm run sync

      - name: Commit and push catalog
        run: |
          git config user.name "eiei-mc-items-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog icons package.json || true
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "chore: npm run sync refresh wiki item catalog"
            git push
          fi
