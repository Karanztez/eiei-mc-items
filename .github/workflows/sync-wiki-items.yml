name: Sync Minecraft Wiki items

on:
  schedule:
    - cron: "15 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync catalog from minecraft.wiki
        run: node scripts/sync-wiki-items.mjs
      - name: Commit updates
        run: |
          git config user.name "eiei-mc-items-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog icons || true
          git diff --cached --quiet || git commit -m "chore: refresh wiki item catalog"
          git push
